name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q
      - name: Our own fragments
        run: changelog-d check && changelog-d print

  action:
    # The action, exercised exactly as a consumer would call it.
    name: changelog.d
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        id: gate
        with:
          ignore: |
            docs/**
            .github/**
            mkdocs.yml
            *.md
      - run: echo "ok=${{ steps.gate.outputs.ok }} fragments=${{ steps.gate.outputs.fragments }}"
