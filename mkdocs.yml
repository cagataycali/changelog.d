site_name: changelog.d
site_url: https://cagataycali.github.io/changelog.d/
site_description: One file per change. Parallel pull requests, and the agents opening them, never conflict on CHANGELOG.md again.
site_author: Cagatay Cali
repo_url: https://github.com/cagataycali/changelog.d
repo_name: cagataycali/changelog.d
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  custom_dir: overrides
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: paper
      toggle:
        icon: material/weather-night
        name: Lights off
    - media: "(prefers-color-scheme: dark)"
      scheme: ink
      toggle:
        icon: material/weather-sunny
        name: Lights on
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Why: why.md
  - Fragments: fragments.md
  - GitHub Action: action.md
  - CLI: cli.md
  - For agents: agents.md
  - The story: story.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cagataycali
